[project]
name = "parking-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "en-core-web-lg",
    "fastapi>=0.162.0",
    "filelock>=3.0",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "mcp==2.3.0",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tzdata>=2026.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
parking-bot = "parking_chatbot.chatbot.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
